[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    slow: tests that take more than 2 seconds
    network: tests that touch the network (none by policy — kept for future-proofing)
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:altair.*